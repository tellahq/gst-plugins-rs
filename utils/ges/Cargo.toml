[package]
name = "gst-plugin-ges"
version.workspace = true
authors = ["Thibault Saunier <tsaunier@igalia.com>"]
license = "MPL-2.0"
description = "GStreamer Editing Services Plugin"
repository.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
gst.workspace = true
gst-base.workspace = true
gst-controller.workspace = true
ges = {workspace = true, features = ["v1_28"]}
gst-validate = { workspace = true, optional = true }
itertools = "0.14"

[lib]
name = "gstrsges"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[build-dependencies]
gst-plugin-version-helper.workspace = true

[features]
static = []
capi = []
doc = ["gst/v1_18"]
validate = ["dep:gst-validate"]

[package.metadata.capi]
min_version = "0.9.21"

[package.metadata.capi.header]
enabled = false

[package.metadata.capi.library]
install_subdir = "gstreamer-1.0"
versioning = false
import_library = false

[package.metadata.capi.pkg_config]
requires_private = "gstreamer-1.0, gstreamer-base-1.0, gstreamer-editing-services-1.0, gobject-2.0, glib-2.0, gmodule-2.0"
